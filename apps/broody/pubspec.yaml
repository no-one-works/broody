name: broody
description: Your daily video diary app

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.2.0+20

environment:
  sdk: ">=3.0.0 < 4.0.0"

dependencies:
  adaptive_dialog: ^2.1.0
  animated_list_plus: ^0.5.0
  animations: ^2.0.3
  auto_route: ">=5.0.4 <6.0.0"
  auto_size_text: ^3.0.0
  blobs: ^2.0.0
  blur: ^4.0.0
  blurhash_dart: ^1.1.0
  dartx: ^1.2.0

  duration: ^3.0.11
  flutter:
    sdk: flutter
  flutter_blurhash: ^0.8.2
  flutter_hooks: ^0.20.5
  flutter_local_notifications: ^17.2.1+2
  flutter_localizations:
    sdk: flutter
  flutter_sticky_header:
    git:
      url: https://github.com/UnderKoen/flutter_sticky_header
  flutter_timezone: ^2.1.0
  freezed_annotation: ^2.2.0
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hooks_riverpod: ^2.1.3
  image_fade: ^0.6.2
  image_picker: ^1.0.1
  intl: ^0.19.0
  material_color_utilities:
  package_info: ^2.0.2
  path_provider: ^2.0.11
  photo_manager: ^3.2.2
  process_value: ^0.1.0
  rivership: ^0.1.1
  rxdart: ^0.28.0
  share_plus: ^6.3.4
  sliver_tools: ^0.2.7
  state_notifier: ^1.0.0
  timezone: ^0.9.2
  uuid: ^4.4.2
  version: ^3.0.2
  video_player: ^2.4.5
  video_thumbnail: ^0.5.2
  video_transcode: ^0.1.0
  wakelock: ^0.6.2

dev_dependencies:
  auto_route_generator: "<6.0.0"
  build_runner: ^2.2.0
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  freezed: ^2.3.2
  json_serializable: ^6.5.4
  lintervention: ^0.1.1

# flutter pub run flutter_launcher_icons:main
flutter_icons:
  android: true
  ios: true

  image_path: "icons/icon.png"
  adaptive_icon_background: "#1A0E28"
  adaptive_icon_foreground: "icons/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/img/
    - assets/rive/
    - assets/video/
    - fonts/
